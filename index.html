<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qi Harmony Academy</title>
<meta name="description" content="Qigong and Tai Chi teaching management system">
<meta name="theme-color" content="#2a6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Qi Harmony">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--jade:#2a6f5e;--jade-d:#1d4f42;--jade-l:#dcebe4;--cream:#faf6ec;--beige:#efe5d2;--gold:#b8923a;--gold-d:#8a6a1f;--gold-l:#f3e6c4;--ink:#22302b;--mute:#58665f;--line:#e1d8c3;--red:#a33a2f;--red-l:#f7e1de;--amber:#7a4f00;--amber-l:#fbefd0;--card:#fffdf8;--r:16px;--fs:17px;--shadow:0 2px 10px rgba(34,48,43,.08)}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;overflow-x:hidden}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:Georgia,"Noto Serif","Times New Roman",serif;color:var(--jade-d);line-height:1.25;margin:0 0 .5rem}
h1{font-size:1.55rem}h2{font-size:1.25rem}h3{font-size:1.08rem}
a{color:var(--jade-d)}
p{margin:.3rem 0 .7rem}
small,.muted{color:var(--mute)}
small{font-size:.82rem}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
#side{display:none}
#content{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:rgba(250,246,236,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:.55rem 1rem;padding-top:calc(.55rem + env(safe-area-inset-top));display:flex;align-items:center;gap:.6rem}
#top .brand-m{display:flex;align-items:center;gap:.5rem;font-family:Georgia,serif;font-weight:700;color:var(--jade-d);min-width:0}
#top .brand-m span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .sp{flex:1}
#main{padding:1rem 1rem 6.5rem;max-width:1100px;width:100%;margin:0 auto;outline:none}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(0,0,0,.06)}
#bottom button{flex:1;border:0;background:none;padding:.45rem .1rem .35rem;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;color:var(--mute);cursor:pointer}
#bottom button[aria-current=page]{color:var(--jade-d);font-weight:700}
#bottom button[aria-current=page] svg{stroke:var(--jade-d)}
svg.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:48px;padding:.55rem 1.1rem;border-radius:14px;border:1.5px solid var(--jade);background:var(--card);color:var(--jade-d);font-weight:600;cursor:pointer;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{background:var(--jade-l)}
.btn.primary{background:var(--jade);color:#fff;border-color:var(--jade)}
.btn.primary:hover{background:var(--jade-d)}
.btn.gold{background:var(--gold-l);border-color:var(--gold);color:#5a4210}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger.solid{background:var(--red);color:#fff}
.btn.sm{min-height:40px;padding:.3rem .8rem;font-size:.92rem;border-radius:12px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;min-width:44px;min-height:44px;border-radius:12px;cursor:pointer;font-size:1.1rem;color:var(--ink)}
.icon-btn:hover{background:var(--beige)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem;box-shadow:var(--shadow);margin-bottom:1rem}
.card h2,.card h3{margin-bottom:.6rem}
.grid{display:grid;gap:.8rem}
.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem;box-shadow:var(--shadow)}
.stat b{display:block;font-family:Georgia,serif;font-size:1.6rem;color:var(--jade-d);line-height:1.2}
.stat span{font-size:.85rem;color:var(--mute)}
.stat.gold{border-color:var(--gold);background:linear-gradient(135deg,#fffaf0,var(--gold-l))}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.stack>*+*{margin-top:.6rem}
.badge{display:inline-block;padding:.1rem .6rem;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--beige);color:var(--ink);white-space:nowrap}
.badge.ok{background:var(--jade-l);color:var(--jade-d)}
.badge.warn{background:var(--amber-l);color:var(--amber)}
.badge.bad{background:var(--red-l);color:var(--red)}
.badge.gold{background:var(--gold-l);color:#5a4210}
.badge.demo{background:#e8e0f5;color:#4b3a7a}
.linkcard{display:flex;justify-content:space-between;align-items:center;gap:.6rem;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem;margin-bottom:.6rem;min-height:60px;box-shadow:var(--shadow)}
.linkcard:hover{border-color:var(--jade)}
.linkcard strong{display:block}
.fld{margin-bottom:.8rem}
.fld label,.lbl{display:block;font-weight:600;font-size:.92rem;margin-bottom:.25rem}
.fld input,.fld select,.fld textarea,.search{width:100%;min-height:48px;padding:.55rem .75rem;border:1.5px solid #cfc5ac;border-radius:12px;background:#fff;font-size:1rem}
.fld textarea{min-height:90px;resize:vertical}
.fld small{display:block;margin-top:.2rem}
.fld input[type=checkbox],.fld input[type=radio]{width:auto;min-height:auto}
.req{color:var(--red)}
.chk{display:flex;gap:.6rem;align-items:center;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--jade);flex:none}
.form-err{background:var(--red-l);border:1px solid var(--red);color:#6b1f17;border-radius:12px;padding:.6rem .8rem;margin-bottom:.8rem;font-weight:600}
.form-grid{display:grid;grid-template-columns:1fr;gap:0 .8rem}
.modal-back{position:fixed;inset:0;background:rgba(20,30,26,.5);z-index:250;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--cream);width:100%;max-height:94vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:.7rem .6rem .5rem 1.1rem;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font-size:1.15rem}
.modal-b{padding:1rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom));overflow:auto}
.sticky-actions{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;margin-top:.8rem}
#toasts{position:fixed;left:0;right:0;top:calc(.6rem + env(safe-area-inset-top));z-index:300;display:flex;flex-direction:column;align-items:center;gap:.4rem;pointer-events:none;padding:0 .8rem}
.toast{pointer-events:auto;background:var(--jade-d);color:#fff;padding:.7rem 1rem;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:520px;font-weight:600}
.toast.err{background:var(--red)}
.toast.warn{background:var(--amber);}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:.6rem;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:.4rem .9rem;min-height:42px;cursor:pointer;font-size:.92rem;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--jade);color:#fff;border-color:var(--jade)}
.tabs{display:flex;gap:.3rem;margin-bottom:.8rem;border-bottom:2px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:.6rem .9rem;min-height:46px;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--jade-d);border-bottom-color:var(--gold)}
.search-row{display:grid;grid-template-columns:1fr;gap:.5rem;margin-bottom:.8rem}
.empty{text-align:center;padding:2rem 1rem;color:var(--mute);border:2px dashed var(--line);border-radius:var(--r);background:rgba(255,255,255,.5)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:.3rem}
.bar{height:12px;border-radius:99px;background:var(--beige);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),#4da58b)}
.bar.gold i{background:linear-gradient(90deg,var(--gold),#d8b45e)}
.barrow{display:grid;grid-template-columns:9.5rem 1fr 2.2rem;gap:.5rem;align-items:center;margin:.35rem 0;font-size:.9rem}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:.5rem .55rem;text-align:left;vertical-align:top}
th{background:var(--beige);font-size:.82rem;text-transform:none;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem}
.seg button{min-height:46px;border:1.5px solid var(--line);background:#fff;border-radius:11px;font-size:.8rem;font-weight:600;cursor:pointer;padding:.2rem}
.seg button[aria-pressed=true].p{background:var(--jade);color:#fff;border-color:var(--jade)}
.seg button[aria-pressed=true].l{background:var(--gold);color:#fff;border-color:var(--gold)}
.seg button[aria-pressed=true].a{background:var(--red);color:#fff;border-color:var(--red)}
.seg button[aria-pressed=true].e{background:#5b6b8a;color:#fff;border-color:#5b6b8a}
.att-row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.7rem;margin-bottom:.6rem}
.lvl{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem}
.lvl button{min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:11px;font-weight:700;cursor:pointer}
.lvl button[aria-pressed=true]{background:var(--jade);color:#fff;border-color:var(--jade)}
.crit{border-bottom:1px solid var(--line);padding:.6rem 0}
.crit b{display:block;margin-bottom:.3rem}
.notice{border-radius:14px;padding:.7rem .9rem;margin-bottom:1rem;border:1px solid var(--gold);background:var(--gold-l);color:#4b3809}
.notice.safe{background:var(--jade-l);border-color:var(--jade);color:var(--jade-d)}
.notice.bad{background:var(--red-l);border-color:var(--red);color:#6b1f17}
.hero{background:linear-gradient(135deg,var(--jade-d),var(--jade));color:#fff;border-radius:20px;padding:1.1rem 1.2rem;margin-bottom:1rem;position:relative;overflow:hidden}
.hero h1{color:#fff;margin:0}
.hero p{margin:.2rem 0 0;color:#e7f2ec}
.hero svg.bg{position:absolute;right:-20px;top:-20px;width:140px;height:140px;opacity:.14}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1rem}
.qa .btn{flex-direction:column;min-height:74px;font-size:.95rem}
.week{display:grid;gap:.6rem}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.month .dh{font-size:.72rem;text-align:center;color:var(--mute);font-weight:700}
.month button{min-height:52px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.2rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.85rem}
.month button.out{opacity:.45}
.month button.today{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold-l)}
.month button[aria-pressed=true]{background:var(--jade);color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:.2rem .8rem;margin:0}
.kv dt{font-size:.8rem;color:var(--mute);font-weight:700;margin-top:.5rem}
.kv dd{margin:0}
.steps{padding-left:1.2rem}.steps li{margin-bottom:.35rem}
.sec-edit{border:1px solid var(--line);border-radius:14px;padding:.7rem;margin-bottom:.7rem;background:var(--card)}
.sec-edit .mins{width:5.5rem}
.mchip{display:inline-flex;align-items:center;gap:.3rem;background:var(--jade-l);color:var(--jade-d);border-radius:999px;padding:.2rem .3rem .2rem .7rem;font-size:.85rem;margin:.15rem .25rem .15rem 0}
.mchip button{border:0;background:rgba(0,0,0,.08);border-radius:50%;width:26px;height:26px;cursor:pointer;line-height:1}
.total-ok{color:var(--jade-d);font-weight:700}.total-bad{color:var(--red);font-weight:700}
.photos{display:flex;gap:.5rem;flex-wrap:wrap}
.photos figure{margin:0;position:relative}
.photos img{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.photos figure button{position:absolute;top:-6px;right:-6px;width:30px;height:30px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer}
.mv-photo{width:100%;max-width:420px;border-radius:14px;border:1px solid var(--line)}
.pose{width:100%;max-width:240px;display:block;margin:0 auto}
/* Teaching mode */
#teach{position:fixed;inset:0;z-index:200;background:#12201b;color:#f6f1e3;display:flex;flex-direction:column}
#teach .th{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.6rem .8rem;padding-top:calc(.6rem + env(safe-area-inset-top));background:#0c1613;border-bottom:1px solid #2a3d36}
#teach .th .tt{order:10;flex:1 1 100%;min-width:0;display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}#teach .th .sp{flex:1}
#teach .th .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#teach .th small{color:#b9c7bf;white-space:nowrap}
#teach .tb{flex:1;overflow:auto;padding:1rem;font-size:var(--tfs,20px);line-height:1.5;-webkit-overflow-scrolling:touch}
#teach .tb h1{color:#f3e2b3;font-size:1.7em;margin-bottom:.2rem}
#teach .tb h3{color:#9fd3bf;font-size:.9em;margin:1rem 0 .2rem;text-transform:uppercase;letter-spacing:.05em}
#teach .tb .cn{color:#d9c88f;font-size:1.1em}
#teach .tb .box{background:#1b2d26;border:1px solid #2f473d;border-radius:16px;padding:.8rem 1rem;margin-top:.8rem}
#teach .tb .box.warnb{background:#33281a;border-color:#6d5420}
#teach .tb .box.nextb{background:#162a33;border-color:#2c5062}
#teach .pose-wrap{background:#f6f1e3;border-radius:18px;padding:.6rem;max-width:min(170px,24vh);margin:.5rem auto}
#teach .pose-wrap img{width:100%;border-radius:12px;display:block}
#teach .modes{display:flex;gap:.4rem;margin:.6rem 0;flex-wrap:wrap}
#teach .modes button{flex:1;min-height:48px;border-radius:12px;border:1.5px solid #3b5a4e;background:#1b2d26;color:#e9efe9;font-weight:600;cursor:pointer;font-size:.8em;padding:.3rem}
#teach .modes button[aria-pressed=true]{background:var(--gold);color:#1a1405;border-color:var(--gold)}
#teach .tf{background:#0c1613;border-top:1px solid #2a3d36;padding:.6rem .8rem calc(.6rem + env(safe-area-inset-bottom))}
#teach .trow{display:flex;gap:.6rem;align-items:center}#teach .timer{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:2.7rem;font-weight:700;text-align:center;line-height:1;letter-spacing:.02em;flex:0 0 auto}
#teach .timer.up{color:#ffd36b}
#teach .ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:.5rem}
#teach .ctl button{min-height:56px;padding:.2rem;border-radius:16px;border:1.5px solid #3b5a4e;background:#1f3a31;color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
#teach .tf button.go{flex:1;background:var(--gold);color:#1a1405;border:1.5px solid var(--gold);border-radius:16px;font-weight:700;font-size:1.15rem;min-height:64px;cursor:pointer}
#teach .ctl button.end{background:#5d2a24;border-color:#a33a2f}
#teach .ctl button:disabled{opacity:.4}
#teach .prog{height:6px;background:#26382f}
#teach .prog i{display:block;height:100%;background:var(--gold)}
#teach .iconb{min-width:48px;min-height:48px;border-radius:12px;border:1px solid #3b5a4e;background:#1b2d26;color:#fff;cursor:pointer;font-weight:700}
#printRoot{display:none}
.print-sheet{font-family:Georgia,serif;color:#000;padding:0}
.print-sheet h1{font-size:20pt;color:#000}.print-sheet h2{color:#000;font-size:14pt;margin-top:14pt}
.print-sheet table{font-size:10pt}.print-sheet th{background:#eee;position:static}
.print-head{display:flex;align-items:center;gap:10pt;border-bottom:2px solid #000;padding-bottom:6pt;margin-bottom:10pt}
.print-head img{height:42pt}
.print-foot{margin-top:14pt;font-size:8.5pt;border-top:1px solid #999;padding-top:5pt}
.sigbox{border:1px solid #666;height:22pt}
@media(min-width:620px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.form-grid{grid-template-columns:1fr 1fr}.search-row{grid-template-columns:2fr 1fr 1fr}.qa{grid-template-columns:repeat(3,1fr)}.kv{grid-template-columns:1fr 1fr}.modal-back{align-items:center}.modal{max-width:640px;border-radius:22px}.modal.wide{max-width:860px}.week{grid-template-columns:repeat(7,1fr)}}
@media(min-width:960px){
 #side{display:flex;flex-direction:column;width:250px;flex:none;background:var(--jade-d);color:#e8f1ec;padding:1rem .8rem;position:sticky;top:0;height:100vh;overflow:auto}
 #side .brand{display:flex;align-items:center;gap:.6rem;font-family:Georgia,serif;font-size:1.15rem;font-weight:700;color:#fff;padding:.3rem .5rem 1rem}
 #side button.nv{display:flex;align-items:center;gap:.7rem;width:100%;min-height:48px;border:0;border-radius:12px;background:none;color:#d8e8e0;padding:.5rem .8rem;cursor:pointer;text-align:left;font-size:1rem}
 #side button.nv:hover{background:rgba(255,255,255,.1)}
 #side button.nv[aria-current=page]{background:var(--gold-l);color:#3a2e0d;font-weight:700}
 #side .sidefoot{margin-top:auto;font-size:.75rem;color:#a9c3b8;padding:.6rem .5rem}
 #bottom{display:none}#main{padding-bottom:2rem;padding-top:1.4rem}#top .brand-m{display:none}
 .g4{grid-template-columns:repeat(4,1fr)}
 #teach .tb{padding:1.5rem 12%}
}
body.portal #side,body.portal #bottom{display:none}
@media print{
 body.has-print #app,body.has-print #modalLayer,body.has-print #toasts,body.has-print #teach{display:none!important}
 body.has-print #printRoot{display:block}
 body{background:#fff}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
.spinner{width:42px;height:42px;border:5px solid var(--jade-l);border-top-color:var(--jade);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto .6rem}
@keyframes spin{to{transform:rotate(360deg)}}
#loading{position:fixed;inset:0;z-index:400;background:rgba(250,246,236,.8);display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:600;color:var(--jade-d);text-align:center}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:.5rem;z-index:500}
.ro{background:var(--beige);border-radius:10px;padding:.5rem .7rem;font-weight:600}
.linkbtn{background:none;border:0;color:var(--jade-d);text-decoration:underline;cursor:pointer;padding:.3rem;min-height:40px}
.hl td{background:var(--gold-l)}
ul.clean{list-style:none;padding:0;margin:0}ul.clean li{padding:.5rem 0;border-bottom:1px solid var(--line)}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000}

</style>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Main navigation"></aside>
  <div id="content">
    <header id="top"></header>
    <main id="main" tabindex="-1" aria-live="polite"></main>
  </div>
  <nav id="bottom" aria-label="Main navigation"></nav>
</div>
<div id="modalLayer"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="teach" hidden></div>
<div id="printRoot"></div>
<noscript><p style="padding:2rem">Qi Harmony Academy needs JavaScript enabled.</p></noscript>
<script>
(function(){'use strict';
/* ---- 01-core.js ---- */
/* ===================================================================
   Qi Harmony Academy – core: utilities, i18n, database, UI primitives

/* ---------- dates (all stored as YYYY-MM-DD / HH:MM, Asia/Kuala_Lumpur) ---------- */
function todayStr() { if (window.__today) return window.__today; return new Date().toLocaleDateString('en-CA', { timeZone: TZ }); }
function nowHM() { if (window.__nowHM) return window.__nowHM; return new Date().toLocaleTimeString('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false }); }
function isDate(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return false; const d = new Date(s + 'T00:00:00Z'); return !isNaN(d) && d.toISOString().slice(0, 10) === s; }
function isTime(s) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(s || ''); }
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
function addDays(s, n) { const d = pd(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
const dow = s => pd(s).getUTCDay();
const weekStart = s => addDays(s, -((dow(s) + 6) % 7));
const monthKey = s => s.slice(0, 7);
function addMonths(ym, n) { let [y, m] = ym.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + pad(m); }
function daysInMonth(ym) { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function fmtDate(s) { if (!s) return '—'; const p = String(s).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : s; }
function fmtTime(hm) { if (!hm) return ''; const [h, m] = hm.split(':').map(Number); return `${((h + 11) % 12) + 1}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`; }
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const dayName = s => t(DAYS[dow(s)]);
const dayShort = s => t(DAYS[dow(s)]).slice(0, 3);
function monthLabel(ym) { const [y, m] = ym.split('-').map(Number); return t(MONTHS[m - 1]) + ' ' + y; }
function fmtDateLong(s) { return `${dayShort(s)}, ${fmtDate(s)}`; }
function minutesOf(hm) { const [h, m] = hm.split(':').map(Number); return h * 60 + m; }
function calcAge(dob) { if (!isDate(dob)) return null; const t0 = todayStr(); let a = +t0.slice(0, 4) - +dob.slice(0, 4); if (t0.slice(5) < dob.slice(5)) a--; return a; }
function fmtClock(sec) { const neg = sec < 0; sec = Math.abs(Math.round(sec)); return (neg ? '+' : '') + pad(Math.floor(sec / 60)) + ':' + pad(sec % 60); }

/* ---------- database (IndexedDB primary; localStorage / memory fallback) ---------- */
let dbMode = 'idb', _db = null, dbNote = '';
function openIDB() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB not available'));
    const timer = setTimeout(() => rej(new Error('IndexedDB timeout')), 5000);
    let rq;
    try { rq = indexedDB.open('qi-harmony-academy', 1); } catch (e) { clearTimeout(timer); return rej(e); }
    rq.onupgradeneeded = () => { const db = rq.result; STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); }); };
    rq.onsuccess = () => { clearTimeout(timer); res(rq.result); };
    rq.onerror = () => { clearTimeout(timer); rej(rq.error); };
    rq.onblocked = () => { clearTimeout(timer); rej(new Error('IndexedDB blocked')); };
  });
}
function idbRun(stores, mode, fn) {
  return new Promise((res, rej) => {
    const tx = _db.transaction(stores, mode);
    let out;
    try { out = fn(tx); } catch (e) { try { tx.abort(); } catch (_) {} return rej(e); }
    tx.oncomplete = () => res(out);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('Transaction aborted'));
  });
}
function reindex(store) { IDX[store] = new Map(S[store].map(r => [r.id, r])); }
const get = (store, id) => IDX[store].get(id);
function memUpsert(store, rec) {
  const i = S[store].findIndex(r => r.id === rec.id);
  if (i >= 0) S[store][i] = rec; else S[store].push(rec);
  IDX[store].set(rec.id, rec);
}
function memRemove(store, id) { const i = S[store].findIndex(r => r.id === id); if (i >= 0) S[store].splice(i, 1); IDX[store].delete(id); }
function flushFallback() {
  if (dbMode === 'mem') return;
  try { localStorage.setItem('qi-fallback-db', JSON.stringify(S)); }
  catch (e) { dbMode = 'mem'; dbNote = 'Browser storage is full or blocked – data is kept in memory only. Export a backup now.'; toast(t(dbNote), 'warn', 8000); }
}
async function initDB() {
  try { _db = await openIDB(); dbMode = 'idb'; }
  catch (e) {
    console.warn('IndexedDB unavailable, using fallback', e);
    _db = null;
    try { localStorage.setItem('qi-test', '1'); localStorage.removeItem('qi-test'); dbMode = 'ls'; dbNote = 'IndexedDB is unavailable in this browser mode. Data is saved in simpler browser storage with limited space.'; }
    catch (e2) { dbMode = 'mem'; dbNote = 'No browser storage is available (private mode?). Data will be lost when you close this page. Export backups often.'; }
  }
  await loadAll();
}
async function loadAll() {
  if (dbMode === 'idb') {
    await idbRun(STORES, 'readonly', tx => {
      STORES.forEach(s => { const rq = tx.objectStore(s).getAll(); rq.onsuccess = () => { S[s] = rq.result || []; }; });
    });
  } else if (dbMode === 'ls') {
    try { const o = JSON.parse(localStorage.getItem('qi-fallback-db') || '{}'); STORES.forEach(s => { S[s] = Array.isArray(o[s]) ? o[s] : []; }); } catch (e) { STORES.forEach(s => S[s] = []); }
  }
  STORES.forEach(reindex);
  const st = get('meta', 'settings'), cn = get('meta', 'counters');
  CFG = Object.assign({}, DEFAULT_CFG, st ? st.value : {});
  CNT = Object.assign({}, cn ? cn.value : {});
  healCounters();
}
function healCounters() {
  const mx = (arr, rx) => arr.reduce((m, r) => { const x = rx.exec(r.id || r.receiptNo || ''); return x ? Math.max(m, +x[1]) : m; }, 0);
  CNT.student = Math.max(CNT.student || 0, mx(S.students, /^QH(\d+)$/));
  CNT.class = Math.max(CNT.class || 0, mx(S.classes, /^CL(\d+)$/));
  CNT.receipt = Math.max(CNT.receipt || 0, S.payments.reduce((m, p) => { const x = /(\d+)$/.exec(p.receiptNo || ''); return x ? Math.max(m, +x[1]) : m; }, 0));
}
async function persist(store, puts, dels) {
  if (dbMode === 'idb') {
    await idbRun([store], 'readwrite', tx => { const os = tx.objectStore(store); puts.forEach(r => os.put(r)); dels.forEach(id => os.delete(id)); });
  }
}
async function save(store, rec) {
  if (!rec || rec.id == null) throw new Error('Record has no id');
  rec.updatedAt = Date.now(); if (!rec.createdAt) rec.createdAt = rec.updatedAt;
  await persist(store, [rec], []);
  memUpsert(store, rec); if (dbMode !== 'idb') flushFallback();
  return rec;
}
async function saveMany(store, recs) {
  if (!recs.length) return;
  const now = Date.now(); recs.forEach(r => { r.updatedAt = now; if (!r.createdAt) r.createdAt = now; });
  await persist(store, recs, []);
  recs.forEach(r => memUpsert(store, r)); if (dbMode !== 'idb') flushFallback();
}
async function removeMany(store, ids) {
  if (!ids.length) return;
  await persist(store, [], ids);
  ids.forEach(id => memRemove(store, id)); if (dbMode !== 'idb') flushFallback();
}
const remove = (store, id) => removeMany(store, [id]);
async function replaceAll(data) {
  const next = {}; STORES.forEach(s => { next[s] = Array.isArray(data[s]) ? data[s] : []; });
  if (dbMode === 'idb') {
    await idbRun(STORES, 'readwrite', tx => { STORES.forEach(s => { const os = tx.objectStore(s); os.clear(); next[s].forEach(r => os.put(r)); }); });
  }
  STORES.forEach(s => { S[s] = next[s]; reindex(s); });
  if (dbMode !== 'idb') flushFallback();
  const st = get('meta', 'settings'), cn = get('meta', 'counters');
  CFG = Object.assign({}, DEFAULT_CFG, st ? st.value : {}); CNT = Object.assign({}, cn ? cn.value : {});
  healCounters();
}
const saveCfg = () => save('meta', { id: 'settings', value: CFG });
const saveCnt = () => save('meta', { id: 'counters', value: CNT });
async function nextNo(kind) { CNT[kind] = (CNT[kind] || 0) + 1; await saveCnt(); return CNT[kind]; }

/* ---------- toast / loading / modal ---------- */
function toast(msg, type = 'ok', ms = 3200) {
  const el = document.createElement('div'); el.className = 'toast ' + (type === 'ok' ? '' : type); el.textContent = msg;
  if (type === 'err') el.setAttribute('role', 'alert');
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), ms);
}
function showLoading(msg) {
  let el = $('#loading');
  if (!el) { el = document.createElement('div'); el.id = 'loading'; el.setAttribute('role', 'alert'); document.body.appendChild(el); }
  el.innerHTML = `<div class="spinner"></div><div>${esc(msg || t('Please wait…'))}</div>`;
  return () => { const e = $('#loading'); if (e) e.remove(); };
}
const modalStack = [];
function openModal({ title, html, wide = false, onClose }) {
  const back = document.createElement('div'); back.className = 'modal-back';
  back.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-act="modal.close" aria-label="${esc(t('Close'))}">✕</button></div><div class="modal-b">${html}</div></div>`;
  $('#modalLayer').appendChild(back);
  const entry = { back, el: back.firstElementChild, body: back.querySelector('.modal-b'), opener: document.activeElement, onClose, closed: false,
    close(r) { if (entry.closed) return; entry.closed = true; back.remove(); const i = modalStack.indexOf(entry); if (i >= 0) modalStack.splice(i, 1); if (!modalStack.length && $('#teach').hidden) document.body.classList.remove('noscroll'); try { entry.opener && entry.opener.isConnected && entry.opener.focus(); } catch (e) {} if (entry.onClose) entry.onClose(r); } };
  modalStack.push(entry); document.body.classList.add('noscroll');
  back.addEventListener('mousedown', e => { if (e.target === back) entry.close(); });
  const f = entry.body.querySelector('input:not([type=hidden]),select,textarea,button.primary,button'); (f || entry.el.querySelector('button')).focus({ preventScroll: true });
  return entry;
}
const modalOf = el => modalStack.find(m => m.back.contains(el));
function confirmBox({ title, msg, ok = 'OK', danger = false, cancel = 'Cancel', html = '' }) {
  return new Promise(resolve => {
    const m = openModal({ title: t(title), html: `<p>${esc(msg)}</p>${html}<div class="sticky-actions"><button class="btn" data-act="modal.cancel" type="button">${esc(t(cancel))}</button><button class="btn ${danger ? 'danger solid' : 'primary'}" data-act="modal.ok" type="button">${esc(t(ok))}</button></div>`, onClose: r => resolve(r === true) });
    m.el.querySelector('[data-act="modal.ok"]').focus();
  });
}
function showForm(form, msgs) {
  let box = form.querySelector('.form-err');
  if (!box) { box = document.createElement('div'); box.className = 'form-err'; box.setAttribute('role', 'alert'); form.prepend(box); }
  if (!msgs || !msgs.length) { box.remove(); return; }
  box.innerHTML = msgs.map(m => esc(m)).join('<br>');
  box.scrollIntoView({ block: 'nearest' });
}

/* ---------- files, CSV, print ---------- */
function downloadFile(name, content, mime = 'text/plain') {
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
}
function csvCell(v) {
  if (v == null) return '';
  let s = String(v);
  if (/^[=+\-@\t\r]/.test(s) && isNaN(Number(s))) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const toCSV = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n');
function downloadCSV(name, rows) { downloadFile(name, '﻿' + toCSV(rows), 'text/csv'); toast(t('CSV file downloaded')); }
function printHeader(title) {
  const c = [CFG.instructorName && t('Instructor') + ': ' + CFG.instructorName, CFG.phone, CFG.email, CFG.address].filter(Boolean).join(' · ');
  return `<div class="print-head">${CFG.logo ? `<img src="${esc(CFG.logo)}" alt="">` : ''}<div><div style="font-size:15pt;font-weight:bold">${esc(CFG.academyName)}</div><div style="font-size:9pt">${esc(c)}</div></div></div>${title ? `<h1>${esc(title)}</h1>` : ''}`;
}
const printFooter = (note = '') => `<div class="print-foot">${esc(t('Printed'))} ${fmtDate(todayStr())} ${fmtTime(nowHM())} · ${esc(CFG.academyName)}${note ? ' · ' + esc(note) : ''}</div>`;
function printHTML(inner, title = '', note = '') {
  const root = $('#printRoot');
  root.innerHTML = `<div class="print-sheet">${printHeader(title)}${inner}${printFooter(note)}</div>`;
  document.body.classList.add('has-print');
  const old = document.title; if (title) document.title = title + ' – ' + CFG.academyName;
  let done = false;
  const cleanup = () => { if (done) return; done = true; document.body.classList.remove('has-print'); root.innerHTML = ''; document.title = old; window.removeEventListener('afterprint', cleanup); document.removeEventListener('pointerdown', late, true); };
  const t0 = Date.now(); const late = () => { if (Date.now() - t0 > 2000) cleanup(); };
  window.addEventListener('afterprint', cleanup); document.addEventListener('pointerdown', late, true);
  window.__lastPrint = inner;
  setTimeout(() => { try { window.print(); } catch (e) { toast(t('Printing is not available in this browser.'), 'err'); cleanup(); } }, 60);
}

/* ---------- images (resize before storing) ---------- */
function fileToDataURL(file, max = 800, q = 0.8) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error(t('Please choose an image file.')));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error(t('Could not read the file.')));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error(t('That image could not be opened.')));
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * k), h = Math.round(img.height * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', q));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function ik(H, Fp, l, dir) {
  let dx = Fp[0] - H[0], dy = Fp[1] - H[1], d = Math.hypot(dx, dy) || 1; const mx = 2 * l - .5;

}

    if (!side) {

      H = [cx, hy]; legs = [[[cx - 8, hy], fl, 1], [[cx + 8, hy], fr, -1]];
    } else {
      if (P.st === 'bow') { hy = 156; fl = [cx + 40, g]; fr = [cx - 36, g]; } else if (P.st === 'bowback') { hy = 156; fl = [cx - 40, g]; fr = [cx + 34, g]; } else if (P.st === 'toe') { hy = 140; fl = [cx + 20, g - 6]; fr = [cx - 4, g]; } else if (P.st === 'wide') { hy = 160; fl = [cx + 40, g]; fr = [cx - 40, g]; } else { fl = [cx + 6, g]; fr = [cx - 6, g]; }

/* ---------- lesson generator (local template; no AI) ---------- */
const POSTURE_IDS = ['mv-natural-standing-posture', 'mv-seated-posture', 'mv-gentle-breathing', 'mv-seated-gentle-breathing', 'mv-relaxation', 'mv-seated-relaxation', 'mv-basic-standing-posture'];
function allocate(total, weights) {
  const sum = weights.reduce((a, b) => a + b, 0), raw = weights.map(w => total * w / sum);
  const base = raw.map(x => Math.max(1, Math.floor(x)));
  let diff = total - base.reduce((a, b) => a + b, 0);
  const order = raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).map(x => x[1]);
  for (let k = 0; diff > 0; k++, diff--) base[order[k % order.length]]++;
  while (diff < 0) { const i = base.indexOf(Math.max(...base)); if (base[i] <= 1) break; base[i]--; diff++; }
  return base;
}
function pickMovements(inp, n) {
  const rank = { Beginner: 0, Intermediate: 1, Advanced: 2 }, maxR = rank[inp.level] != null ? rank[inp.level] : 0;
  let pool = sortedMovements();
  if (inp.style) pool = pool.filter(m => m.categoryId === inp.style);
  if (inp.posture === 'seated') { let p = pool.filter(m => m.seatedOk); if (!p.length) p = sortedMovements().filter(m => m.categoryId === CAT.seat); pool = p; }
  pool = pool.filter(m => (rank[m.level] != null ? rank[m.level] : 0) <= maxR && !POSTURE_IDS.includes(m.id));
  return pool.slice(0, n);
}
function sectionText(key, inp, mv) {

  const L = {
    intro: ['Welcome students and state the aim of today’s class: ' + (inp.objectiveText || inp.objective || 'gentle, relaxed practice') + '.', 'Explain that everyone works at their own level and may rest, sit or stop at any time.'],

    warm: seated ? ['Seated: gentle ankle circles, wrist circles and shoulder rolls.', 'Slow arm raises to shoulder height with the breath.'] : ['Gentle ankle and wrist circles.', 'Soft knee bends and small weight shifts from foot to foot.', 'Slow shoulder rolls. Avoid forced stretching.'],
    posture: [seated ? 'Seated posture: feet flat, spine long, shoulders relaxed.' : 'Natural standing posture: feet hip-width, knees soft, shoulders relaxed.', 'Gentle breathing: slow, smooth, never forced, no breath-holding.'],
    main: ['Teach each movement slowly: demonstrate, explain, then practise together.', 'Offer a rest or a drink after every 2 to 3 movements.', senior ? 'Use the senior-friendly or seated version for anyone who needs it.' : 'Offer the easier variation wherever needed.'],
    correct: ['Walk around and give short, positive, individual corrections.', 'Check knees, shoulders and breathing first.' + (big ? ' With a larger group, ask students to pair up and check each other.' : ''), 'Never force a position or make students push into discomfort.'],
    cool: ['Slow the pace. Lower the arms gently and take a few slow breaths.', 'Gentle shaking out of the hands and arms.'],
    relax: [seated ? 'Seated relaxation: soften the eyes, jaw, shoulders and belly.' : 'Standing or seated relaxation: scan from head to feet and let the weight settle.', 'Finish quietly for one to two minutes.'],
    feedback: ['Ask how everyone feels. Invite questions.', 'Note any discomfort mentioned for follow-up.'],

}
function generateLesson(inp) {
  const dur = num(inp.duration) || 60, seated = inp.posture === 'seated';
  const mins = allocate(dur, SECTION_DEFS.map(s => s[2]));
  const has = id => !!get('movements', id);
  let main = arr(inp.movementIds).filter(has);
  const senior = inp.age === 'senior' || seated;
  if (!main.length) { const mm = mins[4], n = clamp(Math.round(mm / (senior ? 6 : 5)), 1, 8); main = pickMovements(inp, n).map(m => m.id); }
  const posIds = (seated ? ['mv-seated-posture', 'mv-seated-gentle-breathing'] : ['mv-natural-standing-posture', 'mv-gentle-breathing']).filter(has);
  const relaxIds = [seated ? 'mv-seated-relaxation' : 'mv-relaxation'].filter(has);
  const warmIds = seated ? ['mv-seated-shoulder-movement'].filter(has) : [];
  const sections = SECTION_DEFS.map(([key, title], i) => ({
    key, title, minutes: mins[i], text: sectionText(key, inp), movementIds: key === 'main' ? main : key === 'posture' ? posIds : key === 'relax' ? relaxIds : key === 'warm' ? warmIds : []

    title: (inp.style ? catShort(inp.style) : t('Mixed class')) + (obj ? ' – ' + obj : '') + ` (${dur} min)`,

  };
}

async function callAI(payload) {
  if (!CFG.aiEndpoint) throw new Error(t('No AI service is connected. Add your secure backend address in Settings.'));
  if (!isHttpUrl(CFG.aiEndpoint)) throw new Error(t('The AI endpoint address is not valid.'));
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    const r = await fetch(CFG.aiEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: ctrl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch (e) { throw new Error(t('Could not reach the AI service') + ': ' + (e.name === 'AbortError' ? t('timed out') : e.message)); }
  finally { clearTimeout(timer); }
}

async function hashPin(pin) {
  try { if (window.crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('qi:' + pin)); return Array.from(new Uint8Array(b)).map(x => pad(x.toString(16))).join(''); } } catch (e) {}
  let h = 5381; for (const ch of 'qi:' + pin) h = ((h << 5) + h + ch.charCodeAt(0)) >>> 0; return 'x' + h;
}

function validateBackup(text) {
  let o; try { o = JSON.parse(text); } catch (e) { return { error: t('This file is not valid JSON. Choose a backup file made by this app.') }; }
  if (!o || o.app !== 'qi-harmony-academy' || !o.data || typeof o.data !== 'object') return { error: t('This is not a Qi Harmony Academy backup file.') };
  if (typeof o.schema !== 'number' || o.schema > SCHEMA) return { error: t('This backup was made by a newer version of the app. Please update the app first.') };
  const data = {}, counts = {};
  for (const s of STORES) {
    const v = o.data[s]; if (v == null) { data[s] = []; counts[s] = 0; continue; }
    if (!Array.isArray(v)) return { error: t('Backup data is damaged') + ': ' + s };
    const seen = new Map();
    for (const r of v) { if (!r || typeof r !== 'object' || r.id == null || r.id === '') return { error: t('Backup data is damaged') + ': ' + s }; seen.set(r.id, r); }
    data[s] = Array.from(seen.values()); counts[s] = data[s].length;
  }
  return { data, counts, exportedAt: o.exportedAt };
}
async function restoreBackup(data) {

function barRow(label, n, max, cls = '') {
  const w = max ? Math.round(n / max * 100) : 0;
  return `<div class="barrow"><span>${esc(t(label))}</span><div class="bar ${cls}" role="presentation"><i style="width:${w}%"></i></div><b>${n}</b></div>`;
}

ACT['att.start'] = () => {
  const today = todayStr(), list = sortBy(S.classes.filter(c => c.status !== 'Cancelled' && c.date <= addDays(today, 7) && c.date >= addDays(today, -14)), c => c.date + c.start).reverse();

};

function studentFiltered() {
  const f = UI.stu, q = f.q.trim().toLowerCase();
  return sortBy(S.students.filter(s => {
    if (q && !(s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q))) return false;
    if (f.level && !(s.level === f.level || (s.categories || []).includes(f.level))) return false;
    if (f.status && s.status !== f.status) return false;
    if (f.cls) { const inCls = S.classes.some(c => c.name === f.cls && (c.enrolled || []).includes(s.id)); if (!inCls && s.preferredClass !== f.cls) return false; }
    return true;
  }), s => s.name.toLowerCase());
}
function stuListHTML() {
  const list = studentFiltered();
  if (!S.students.length) return emptyState('No students yet', 'Tap "Register student" to add your first student.', btn('Register student', 'student.new', { cls: 'primary' }));
  if (!list.length) return emptyState('No matching students', 'Try a different search or clear the filters.');
  return list.map(s => `<a class="linkcard" href="${href('students', s.id)}"><span><strong>${esc(s.name)} ${s.demo ? badge('Demo', 'demo') : ''}</strong><small>${esc(s.id)} · ${esc(s.phone)}</small></span><span style="text-align:right">${levelBadge(s.level)} ${badge(s.status, isActive(s) ? 'ok' : 'warn')}</span></a>`).join('');
}

   ${F.text('email', 'Email (optional)', s.email || '', { type: 'email', max: 120 })}

   ${F.select('status', 'Membership status', MEMBERSHIP, s.status, { req: true })}</div>
   <div class="fld"><span class="lbl">${esc(t('Student categories'))}</span>${SPECIAL.map(c => F.check('cats', c, (s.categories || []).includes(c), c)).join('')}</div>
   ${F.area('notes', 'Instructor notes (private)', s.notes || '', { rows: 3 })}
   ${F.area('limitations', 'Exercise limitations or accommodations', s.limitations || '', { rows: 3, hint: 'Only record what the student has voluntarily shared and what is needed for safe teaching. This is private and is never shown in the student portal or on printed class sheets.' })}
   <div class="sticky-actions"><button type="button" class="btn" data-act="modal.cancel">${esc(t('Cancel'))}</button><button class="btn primary" type="submit">${esc(t(n ? 'Register student' : 'Save changes'))}</button></div></form>`;

SUB['student.save'] = async form => {
  const v = formVals(form), errs = [], id = v.id || '';
  const name = (v.name || '').trim().replace(/\s+/g, ' '), phone = (v.phone || '').trim();
  if (name.length < 2) errs.push(t('Please enter the full name.'));
  if ((phone.match(/\d/g) || []).length < 7 || !/^[\d\s+()\-]+$/.test(phone)) errs.push(t('Please enter a valid contact number (at least 7 digits).'));
  if (v.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email.trim())) errs.push(t('The email address is not valid.'));
  if (!isDate(v.regDate)) errs.push(t('Please enter a valid registration date.'));
  if (v.dob && (!isDate(v.dob) || v.dob > todayStr() || calcAge(v.dob) > 120)) errs.push(t('The date of birth is not valid.'));
  if (v.age && (!/^\d+$/.test(v.age) || +v.age < 1 || +v.age > 120)) errs.push(t('Age must be a whole number between 1 and 120.'));
  const digits = p => p.replace(/\D/g, '');
  if (S.students.some(s => s.id !== id && s.name.toLowerCase() === name.toLowerCase() && digits(s.phone) === digits(phone))) errs.push(t('A student with the same name and contact number already exists.'));
  if (errs.length) return showForm(form, errs);
  const old = id ? stu(id) : null;
  const rec = Object.assign({ assigned: [] }, old || {}, {
    id: old ? old.id : 'QH' + pad(await nextNo('student'), 4), name, phone, email: (v.email || '').trim(), emergency: (v.emergency || '').trim(), regDate: v.regDate, dob: v.dob || '', age: v.dob ? '' : (v.age ? +v.age : ''),
    level: v.level, style: v.style || '', preferredClass: v.preferredClass || '', status: v.status, notes: (v.notes || '').trim(), limitations: (v.limitations || '').trim(), categories: arr(v.cats).filter(c => SPECIAL.includes(c))
  });
  await save('students', rec); modalOf(form).close(); toast(t(old ? 'Student updated' : 'Student registered') + ': ' + rec.name);
  if (!old) go('students/' + rec.id); else refresh();
};

ACT['student.deact'] = async el => {
  const s = stu(el.dataset.id), fut = S.classes.filter(c => c.status === 'Scheduled' && c.date >= todayStr() && (c.enrolled || []).includes(s.id));
  if (!await confirmBox({ title: 'Deactivate student', msg: t('{name} will be marked Inactive and removed from {n} upcoming class(es). Attendance, progress and payment history are kept.', { name: s.name, n: fut.length }), ok: 'Deactivate' })) return;
  fut.forEach(c => { c.enrolled = c.enrolled.filter(x => x !== s.id); });
  await saveMany('classes', fut); s.status = 'Inactive'; await save('students', s); toast(t('Student deactivated')); refresh();
};
ACT['student.react'] = async el => { const s = stu(el.dataset.id); s.status = 'Active'; await save('students', s); toast(t('Student reactivated')); refresh(); };
ACT['student.del'] = async el => {
  const s = stu(el.dataset.id), pays = S.payments.filter(p => p.studentId === s.id).length;
  if (!await confirmBox({ title: 'Delete student', msg: t('Permanently delete {name}? Their attendance, assessments and home-practice records will be deleted and they will be removed from all classes. {n} payment record(s) are kept for your accounts. This cannot be undone. Consider Deactivate instead.', { name: s.name, n: pays }), ok: 'Delete permanently', danger: true })) return;
  const cl = S.classes.filter(c => (c.enrolled || []).includes(s.id)); cl.forEach(c => { c.enrolled = c.enrolled.filter(x => x !== s.id); });
  await saveMany('classes', cl);
  await removeMany('attendance', S.attendance.filter(a => a.studentId === s.id).map(a => a.id));
  await removeMany('assessments', S.assessments.filter(a => a.studentId === s.id).map(a => a.id));
  await removeMany('practice', S.practice.filter(a => a.studentId === s.id).map(a => a.id));
  S.fees.filter(f => f.studentId === s.id).forEach(f => f.studentName = f.studentName || s.name);
  await saveMany('fees', S.fees.filter(f => f.studentId === s.id)); S.payments.filter(p => p.studentId === s.id).forEach(p => p.studentName = p.studentName || s.name);
  await saveMany('payments', S.payments.filter(p => p.studentId === s.id));
  await remove('students', s.id); toast(t('Student deleted')); go('students');
};

const statusKind = s => s === 'Completed' ? 'ok' : s === 'Cancelled' ? 'bad' : 'gold';
function classRow(c, o = {}) {
  const n = (c.enrolled || []).length;
  return `<a class="linkcard" href="${href('classes', c.id)}"><span><strong>${esc(c.name)} ${c.demo ? badge('Demo', 'demo') : ''}</strong><small>${o.date ? esc(fmtDateLong(c.date)) + ' · ' : ''}${esc(fmtTime(c.start))}–${esc(fmtTime(c.end))}${c.venue ? ' · ' + esc(c.venue) : ''}</small></span><span style="text-align:right">${badge(c.status, statusKind(c.status))} <small style="display:block">${n}/${c.capacity} ${esc(t('enrolled'))}</small></span></a>`;

}
VIEWS.classes = {
  title: 'Classes',
  render(id) {
    if (id) return classDetail(id);

  }

ACT['cls.tab'] = el => { UI.cls.tab = el.dataset.v; refresh(); };
function listView() {
  const u = UI.cls, show = u.show || 'upcoming', today = todayStr(), q = (u.q || '').toLowerCase();
  let l = S.classes.filter(c => !q || c.name.toLowerCase().includes(q));

  else if (show === 'past') l = sortBy(l.filter(c => c.date < today && c.status !== 'Cancelled'), classSort).reverse();
  else if (show === 'cancelled') l = sortBy(l.filter(c => c.status === 'Cancelled'), classSort).reverse();
  else l = sortBy(l, classSort).reverse();
  return `<input class="search" style="margin-bottom:.6rem" type="search" placeholder="${esc(t('Search classes'))}" aria-label="${esc(t('Search classes'))}" value="${esc(u.q || '')}" data-input="cls.q">

  <div id="clsList">${clsListHTML(l)}</div>`;

const PWA_MODE = true;
async function boot() {
  try {
    await initDB(); await seedLibrary();
  } catch (e) {
    console.error(e);
    $('#main').innerHTML = `<div class="card"><h1>${esc('Could not start the application')}</h1><p>${esc(e.message || e)}</p><p>Try reloading the page. If the problem continues, your browser may be blocking local storage (private mode?).</p></div>`;
    return;
  }
  applyTextSize();
  try { const p = sessionStorage.getItem('qi-portal'); if (p && stu(p)) window.__portalStudent = p; } catch (e) {}
  if (!location.hash) location.replace('#/dashboard');
  renderNav(); render();
  if (!CFG.welcomed && !S.students.length) showWelcome(); else if (!CFG.welcomed) { CFG.welcomed = true; saveCfg(); }
  window.addEventListener('online', () => toast(t('Back online')));
  window.addEventListener('offline', () => toast(t('You are offline. The app and your saved data still work.'), 'warn', 5000));
  if (PWA_MODE && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('service-worker.js').then(reg => {
      reg.addEventListener('updatefound', () => { const nw = reg.installing; if (nw) nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) toast(t('A new version is ready. Reload the page to update.'), 'ok', 8000); }); });
    }).catch(e => console.warn('SW registration failed', e));
  }
}
